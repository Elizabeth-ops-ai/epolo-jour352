<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Title</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">Brand</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <h1 class="mb-4">Page Heading</h1>

    <!-- Three equal columns on desktop, two on tablet, stacked on mobile -->
    <section class="row g-4">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border rounded">Column 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border rounded">Column 2</div>
      </div>
      <div class="col-12 col-md-12 col-lg-4">
        <div class="p-3 border rounded">Column 3</div>
      </div>
    </section>

    <!-- Sidebar + main content layout -->
    <section class="row g-4 mt-2">
      <div class="col-12 col-lg-8">
        <div class="p-3 border rounded">Main content (8 of 12 columns)</div>
      </div>
      <div class="col-12 col-lg-4">
        <div class="p-3 border rounded">Sidebar (4 of 12 columns)</div>
      </div>
    </section>
  </main>

  <footer class="container py-4 border-top">
    <p class="text-body-secondary mb-0">&copy; 2026 Your Name</p>
  </footer>

  <!-- Bootstrap JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
